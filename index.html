                text: `1.4. Propiedades ACID:<br>Atomicidad:<br>Una transacción debe ejecutarse exactamente una vez y debe ser atómica, ya sea<br>todo el trabajo o ninguno de ellos. Las operaciones dentro de una transacción suelen<br>compartir una intención común y son interdependientes.<br>Coherencia: Una transacción debe conservar la coherencia de los datos y<br>transformar un estado coherente de los datos en otro estado coherente de los datos.<br>Gran parte de la responsabilidad de mantener la coherencia se aplica al<br>desarrollador de aplicaciones.<br>Aislamiento: Una transacción debe ser una unidad de aislamiento, lo que significa<br>que las transacciones simultáneas deben comportarse como si cada una fuera la<br>única transacción que se ejecuta en el sistema. Dado que un alto grado de<br>aislamiento puede limitar el número de transacciones simultáneas, algunas<br>aplicaciones reducen el nivel de aislamiento a cambio de mejorar el rendimiento.<br>Durabilidad: Una transacción debe ser recuperable y, por tanto, debe tener<br>durabilidad. Si se confirma una transacción, el sistema garantiza que sus<br>actualizaciones pueden persistir incluso si el equipo se bloquea inmediatamente<br>después de la confirmación.`,

                text: `1.6 Arquitectura de los 3 niveles de base de datos:<br>La arquitectura de 3 niveles divide los datos que son físicamente almacenados y cómo los<br>usuarios interactúan con ellos.<br>El nivel externo se enfoca en cómo los usuarios finales visualizan los datos, describe la<br>parte de la base de datos que se interesa a mostrar y maneja múltiples vistas de<br>información, los usuarios pueden variar según sus necesidades y permisos.<br>El nivel conceptual se sitúa en el corazón de la arquitectura, se caracteriza por su<br>integración, la consistencia y la independencia de datos. Este nivel ofrece una visión<br>completa de la estructura de la base de datos en su conjunto, sin importar si los datos están<br>internamente organizados o si son presentados a los usuarios<br>El nivel interno es el nivel más bajo, este nivel detalla el cómo y el dónde se almacenan los<br>datos, la independencia de los datos y los métodos de acceso. En este nivel los datos se<br>manejan de manera eficiente, optimizando recursos y garantizando rapidez en las<br>operaciones.<br>Domina la Arquitectura de 3 Niveles en Bases de Datos (ns porque me da el link asi)<br>Jesús. (2023, November 27). Domina la Arquitectura de 3 Niveles en Bases de<br>Datos. Tutoriales Dongee.`,

            {

                text: `1.8.1 Sistemas gestores relacionales<br>Este modelo se basa fundamentalmente en establecer relaciones o vínculos entre<br>los datos imaginando una tabla aparte por cada relación existente con sus propios<br>registros y atributos.<br>- MySQL<br>Es un SGBD multihilo y multiusuario utilizado en la gran parte de páginas web<br>actuales tanto como en aplicaciones creadas con software libre. Sus ventajas son:<br>Facilidad de uso y gran rendimiento<br>Facilidad para instalar y configurar<br>Soporte multiplataforma<br>Soporte SSL<br>Cómo desventaja tiene la escalabilidad, debido a que no trabaja de manera<br>eficiente con bases de datos muy grandes que superan un determinado<br>tamaño<br>-MariaDB<br>Es una derivación de MySQL que cuenta con la mayoría de características de este e<br>incluye varias extensiones. Tiene la ventaja de que es compatible con MySQL. Sus<br>principales características son:<br>-aumento de motores de almacenamiento<br>Gran escalabilidad<br>Seguridad y rapidez en transacciones<br>Extensiones y nuevas características relacionadas con su aplicación para<br>bases de datos NoSQL<br>-SQLite<br>Es una biblioteca escrita en C que implementa un SGBD y que permite<br>transacciones sin necesidad de un servidor ni configuraciones. Es una biblioteca<br>utilizada en multitud de aplicaciones actuales debido a que es open source<br>y las consultas son muy eficientes, sus principales características son:<br>Su tamaño, al ser una biblioteca es menor que cualquier SGBD<br>Reúne ACID<br>Portabilidad y rendimiento<br>Como principal desventaja es su escalabilidad ya que no soporta bases de datos<br>que sean muy grandes.<br>-PostgreSQL<br>Este sistema está orientado a objetos y es libre, sus principales características son:<br>Control de concurrencias multiversión (MVCC)<br>Flexibilidad en cuanto a lenguajes de programación<br>Multiplataforma<br>Dispone de una herramienta facil e intuitiva para la administración de las<br>bases de datos<br>Eficiencia y estabilidad<br>Su principal desventaja es la lentitud para la administración de bases de datos<br>pequeñas, ya que está optimizado para gestionar grandes volúmenes de datos.<br>-Microsoft SQL Server<br>Es un sistema gestor de bases de datos basado en el lenguaje Transact-SQL, capaz<br>de poner a disposición grandes cantidades de datos de manera simultánea, sus<br>principales características son:<br>•<br>Soporte exclusivo por parte de Microsoft<br>Escalabilidad, estabilidad y seguridad<br>Posibilidad de cancelar consultas<br>Potente entorno gráfico de administración que permite utilizar comandos DDL<br>y DML<br>Se puede usar en plataformas como Linux o Docker a pesar de ser de<br>Microsoft<br>Su principal desventaja es el precio.<br>-ORACLE<br>Ha sido el sistema gestor por excelencia para el mundo empresarial, por ser<br>considerado como el más completo y robusto destacando por:<br>Soporte de transacciones<br>Estabilidad<br>Escalabilidad<br>Multiplataforma<br>Su principal desventaja es el coste.`,

                title: "1.8.2 Sistemas gestores no relacionales",

                text: `1.8.1 Sistemas gestores no relacionales<br>Una base de datos NoSQL es aquella base de datos que no requiere de estructura<br>de datos fijas como tablas, no garantiza completamente las características ACID y<br>escala muy bien horizontalmente, se utilizan en entornos distribuidos que han de<br>estar siempre disponibles y operativos que gestionan los datos. Los principales<br>sistemas gestores no relacionales son:<br>-MongoDB<br>Este SGBD orientado a ficheros almacena la información en estructuras BSON con<br>un esquema dinámico que permite su facilidad de integración. Empresas como<br>Google, Facebook, eBay, Cisco o Adobe utilizan MongoDB como gestor de bases de<br>datos. Las principales características son:<br>Indexación y replicación<br>Balanceo de carga<br>Almacenamiento en ficheros<br>Consultas ad hoc<br>Escalabilidad horizontal<br>Open Source<br>Como desventaja principal es que no es un SGBD adecuado para realizar<br>transacciones complejas<br>-Redis<br>Está basado en el almacenamiento clave-valor. Almacena todo tipo de datos, desde<br>cadenas, hashes, listas, etc. Su principal uso es para el almacenamiento en<br>memoria caché y la administración de sesiones.<br>Sus principales características son:<br>Atomicidad y persistencia<br>Gran velocidad<br>Simplicidad<br>Multiplataforma<br>-Cassandra<br>Utiliza almacenamiento clave-valor. Es un SGBD distribuido y estable. Facebook,<br>Twitter, Instagram, Spotify y Netflix utilizan Cassandra.<br>Dispone de un lenguaje propio para las consultas denominado CQL (Cassandra<br>Query Language)<br>Sus principales características son:<br>Multiplataforma<br>Propio lenguaje de consultas<br>Escalado lineal y horizontal<br>Es un SGBD distribuido<br>Utiliza una arquitectura peer-to-peer`,

            {
                id: 13,
                title: "1.9 Panorama de los modelos de datos",
                category: "fundamentos",
                text: `1.9 Panorama de los modelos de datos<br>Actualmente los datos se construyen en 3 fases o niveles progresivos<br>1. Modelo Conceptual de Datos<br>Define que contiene el sistema a nivel general y se enfoca en los conceptos del<br>negocio, sus reglas principales y entidades clave sin entrar en detalles técnicos<br>2. Modelo Lógico de Datos<br>Define cómo se estructuran los datos, independientemente de la tecnología de base<br>de datos, ofrecen más detalles sobre los conceptos de datos y las relaciones de<br>datos complejas que se identificaron en el modelo conceptual.<br>3. Modelo de datos físico<br>Asignan los modelos de datos lógicos a una tecnología específica de SGBD y usan<br>la terminología del software, dando detalles como el tipo de campos de datos<br>representados en el SGBD, relacionales de datos representados en el SGBD,<br>detalles adicionales como el ajuste del rendimiento.<br><br>Tipos de técnicas de modelado de datos<br>1. Modelado de datos jerárquico<br>Es jerárquico, representa las relaciones entre los distintos elementos de datos en<br>formato de árbol. Representan las relaciones de uno a varios, con parents o clases<br>de datos raíz que se asignan a varios children<br>2. Modelado de datos gráfico<br>Representan relaciones de datos que tratan a las entidades por igual. Las entidades<br>pueden vincularse entre sí en relaciones de uno a varios o de varios a varios si<br>ningún concepto de parent o child<br>3. Modelado de datos relacional<br>Se visualiza las clases de datos como tablas. Las diferentes tablas de datos se unen<br>o enlazan entre sí mediante el uso de claves que representan la relación de las<br>entidades del mundo real. Útil para representar la estructura de la base de datos<br>relacional<br>4. Modelado de datos orientado a objetos<br>Usa estructura de datos llamadas objetos para almacenar datos. Estos objetos de<br>datos son abstracciones de software de entidades del mundo real. Este modelado<br>supera muchas limitaciones de los modelos de datos relacionales y son populares<br>en las bases de datos multimedia.<br>5. Modelado de datos dimensional<br>Guarda grandes cantidades de estos para su análisis. Puede usar proyectos de<br>modelado de datos dimensionales para el almacenamiento y la recuperación de<br>datos a alta velocidad desde un almacén de datos. Los modelos dimensionales usan<br>datos duplicados o redundantes y priorizan el rendimiento sobre el uso de menos<br>espacio para el almacenamiento de datos.`,
                link: "https://aws.amazon.com/es/what-is/data-modeling/"
            },
            {
                id: 14,
                title: "2.1 Definicion de modelo de datos",
                category: "modelos",
                text: `2.1 Definicion de modelo de datos<br>El modelado de datos es el proceso de crear una representación visual de todo un sistema<br>de información o partes de él para comunicar conexiones entre puntos de datos y<br>estructuras.<br>Su objetivo es ilustrar los tipos de datos utilizados y almacenados dentro del sistema y las<br>relaciones entre estos tipos de datos. También describe las formas en que se pueden<br>agrupar y organizar los datos, junto con sus formatos y atributos. Se crean en función de las<br>necesidades empresariales. Sus reglas se definen para que puedan incorporarse al diseño<br>de un nuevo sistema o adaptarse en la iteración de uno existente. El modelado de datos<br>utiliza esquemas estandarizados y técnicas formales, proporcionando una forma común,<br>coherente y predecible de definir y gestionar los recursos de datos en toda una<br>organización.`,
                link: "https://www.ibm.com/mx-es/think/topics/data-modeling"
            },
            {
                id: 15,
                title: "2.2 Modelo entidad relación",
                category: "modelos",
                text: `2.2 Modelo entidad relación.<br>Los modelos ER se emplean para diseñar bases de datos en múltiples campos, como los<br>sistemas de información empresarial, los procesos de negocio, la investigación, la<br>educación o la ingeniería de software. En concreto:<br>Diseño de bases de datos: los diagramas entidad-relación se emplean para diseñar bases<br>de datos relacionales. En ingeniería de software este suele ser el primer paso para<br>concretar los requisitos de un proyecto de sistemas de información.<br>Depuración de errores de bases de datos: el modelo ER permite analizar bases de datos<br>existentes con el fin de encontrar problemas de lógica o implementación.<br>Sistemas de información empresarial: se recurre a modelos ERD para diseñar bases de<br>datos relacionales para un proceso de negocio que permitan simplificar el proceso y mejorar<br>sus resultados.<br>Reingeniería de procesos de negocio: el modelo entidad relación también contribuye a<br>analizar bases de datos que se emplean para rediseñar y optimizar un procesos de negocio.<br>Investigación: los modelos ER pueden ser útiles para analizar datos estructurados que se<br>emplean en investigaciones.<br>Educación: un diagrama entidad-relación sirve para planificar bases de datos de información<br>con propósitos educativos.<br>El modelo entidad relación es, básicamente, el esquema que se emplea para ilustrar las<br>relaciones que se establecen en una base de datos. Bases de datos que se emplean en<br>empresas y todo tipo de entidades que generan ingentes volúmenes de datos a los que se<br>puede sacar partido, si se sabe cómo.`,

                id: 16,

                category: "modelos",
                text: `2.2.1 Entidades, atributos y relaciones.<br>Entidades: son las personas, objetos o conceptos de los que trata una base de datos. Por<br>ejemplo, en una base de datos de ventas de un negocio, las entidades podrían ser, entre<br>otras, "Cliente", "Producto", "Factura" o "Dirección".<br>Atributos: describen las propiedades que posee cada entidad. En el ejemplo anterior,<br>atributos de la entidad "Cliente" podrían ser "Nombre", "Primer Apellido", "Fecha de<br>nacimiento", etc.<br>Relaciones: sirven para crear vínculos entre parejas de entidades. Siguiendo con el<br>ejemplo, cada "Cliente" está vinculado a una "Dirección", a uno o varios "Productos", etc.<br>El diagrama entidad-relación corresponde a la expresión gráfica del modelo entidad<br>relacion. Para ello, se utilizan símbolos:<br>Rectángulos, para representar las entidades.<br>Óvalos, para los atributos.<br>Diamantes o líneas de conexión para representar las relaciones entre entidades y atributos.<br>Las líneas de conexión suelen tener una apariencia gráfica diferente en función del tipo de<br>relación que exista entre las entidades que conectan (puede ser una línea continua o<br>discontinua, por ejemplo).<br>El modelo entidad relación pretende ser un reflejo de la estructura gramatical y, por ello,<br>utilizan:<br>Sustantivos, comunes o propios, para definir tipos de entidades y entidades.<br>Verbos, para definir tipos de relación.<br>Adjetivos, como atributos de una entidad.<br>Adverbios, como atributos de una relación.`,

            },
            {
                id: 17,
                title: "2.2.2 Llaves.",
                category: "modelos",
                text: `2.2.2 Llaves.<br>La llave primaria es un atributo o conjunto de atributos que identifica de manera única cada<br>registro en una tabla. Su importancia radica en su capacidad para garantizar que no existan<br>duplicados en la información almacenada. Imagina una tabla que almacena datos de<br>empleados; la llave primaria podría ser el número de identificación del empleado,<br>asegurando que cada número sea único y, por ende, represente a un empleado específico.<br>Al definir una llave primaria, se establece una restricción única, lo que impide la inserción de<br>registros duplicados. Esto no solo mejora la calidad de los datos, sino que también facilita la<br>búsqueda y recuperación de información de manera eficiente. Además, la llave primaria es<br>crucial para establecer relaciones con otras tablas mediante el uso de llaves foráneas.<br>La llave foránea, por otro lado, crea vínculos entre tablas relacionadas en una base de<br>datos. Esta llave foránea suele ser un atributo en una tabla que coincide con la llave<br>primaria de otra tabla. Este enlace establece una relación referencial, lo que permite que la<br>información se distribuya y relacione de manera coherente.<br>Para comprender mejor la función de la llave foránea, consideremos dos tablas: <<Clientes> >><br>y <<Órdenes». En la tabla <<Órdenes , la llave primaria podría ser el número de orden,<br>mientras que en la tabla Clientes», el número de cliente podría ser la llave primaria. Al<br>introducir una llave foránea en la tabla <<Órdenes>> que hace referencia al número de cliente<br>en la tabla <<Clientes», se establece una conexión significativa entre ambas tablas. Esta<br>relación facilita consultas que implican la combinación de datos de ambas tablas, brindando<br>información más completa y detallada.`,
                link: "https://keepcoding.io/blog/llaves-primarias-y-foraneas/"
            },
            {
                id: 18,
                title: "2.2.3 Cardinalidad de las entidades en una relación.",
                category: "modelos",
                text: `2.2.3 Cardinalidad de las entidades en una relación.<br>Las relaciones en bases de datos permiten relacionar información entre diferentes tablas y<br>garantizar que los datos sean precisos y consistentes.<br>Existen principalmente tres tipos de relaciones:<br>Relación uno a uno: se utiliza cuando una fila en una tabla está relacionada con<br>exactamente una fila en otra tabla. Esta relación se suele utilizar en casos donde una tabla<br>de datos complementaria solo tiene una fila para cada fila en la tabla principal. Por ejemplo,<br>si tenemos una tabla de "Estudiantes" y una tabla de "Direcciones", cada estudiante solo<br>tiene una dirección, lo que significa que la relación entre las dos tablas es de uno a uno.<br>Relación uno a muchos: significa que una fila en una tabla está relacionada con varias filas<br>en otra tabla. Esta relación se utiliza a menudo cuando hay una entidad principal que tiene<br>varios registros relacionados en otra tabla. Por ejemplo, si tenemos una tabla de<br>"Estudiantes" y una tabla de "Asignaturas", cada estudiante puede tener varias asignaturas,<br>lo que significa que la relación entre las dos tablas es de uno a muchos.<br>Relación muchos a muchos: significa que muchas filas en una tabla están relacionadas con<br>muchas filas en otra tabla. Este tipo de relación se utiliza a menudo cuando hay una entidad<br>que tiene una relación compleja con otra entidad. Por ejemplo, si tenemos una tabla de<br>"Estudiantes" y una tabla de "Cursos", donde cada estudiante puede tomar varios cursos y<br>cada curso puede tener varios estudiantes, la relación entre las dos tablas sería muchos a<br>muchos. Para implementar esta relación, se utiliza una tabla intermedia, también conocida<br>como tabla de "unión" o tabla "puente".<br>Cada tipo de relación tiene su propio propósito y ventajas, y es importante elegir la relación<br>correcta para garantizar la eficiencia de la base de datos.`,
                link: "https://medium.com/@datasciencefem/introducción-a-las-entidades-y-relaciones-conceptos-fundamentales-en-bases-de-datos-822e1862855"
            },
            {
                id: 19,
                title: "2.2.4 Dependencia de existencia y de identificación.",
                category: "modelos",
                text: `2.2.4 Dependencia de existencia y de identificación.<br>Dependencia de existencia<br>Está se da cuando hay una entidad regular relacionada con una entidad débil, de manera<br>que la entidad débil no pueda existir sin la entidad regular.<br>Dependencia de Identificación<br>Tiene que tener un campo clave cada entidad y que este campo clave sea diferente uno del<br>otro y se da cuando la entidad débil necesita el campo cable de la entidad regular.`,
                link: "https://alevillanew.wordpress.com/2010/09/03/2-2-4-dependencia-de-existencia-y-de-identificacion/"

            {
                id: 20,
                title: "2.3 Diseño de modelos de datos ER.",
                category: "modelos",
                text: `2.3 Diseño de modelos de datos ER.<br>Un diagrama de relación entre entidades (diagrama ER o ERD) es una representación<br>visual de cómo los elementos de una base de datos se relacionan entre sí. Los ERDS son<br>un tipo especializado de diagrama de flujo que transmite los tipos de relación entre<br>diferentes entidades dentro de un sistema. Utilizan un conjunto definido de símbolos,<br>incluyendo rectángulos, óvalos y diamantes, y los vinculan con líneas de conexión.<br>Dentro del modelo relacional de diseño de bases de datos, los ERDs establecen cómo se<br>conectan las entradas en una base de datos. Los ERDs son un modelo de datos conceptual<br>de alto nivel que sienta las bases para un diseño y análisis de bases de datos más<br>avanzados.<br>Además, el modelado de relaciones entre entidades puede ayudar a destilar narrativas e<br>insights de una colección aparentemente dispar de puntos de datos.`,
                link: "https://www.ibm.com/mx-es/think/topics/entity-relationship-diagram"
            },
            {
                id: 21,
                title: "2.4 El Diccionario de Datos.",
                category: "modelos",
                text: `2.4 El Diccionario de Datos.<br>Es frecuente que cuando hablamos de diccionario de datos su significado se confunda con<br>el de glosario de negocio o con el de vocabulario de datos, sin embargo, son conceptos<br>distintos.<br>Mientras que un glosario de negocio, o vocabulario de datos, trata de dar significado<br>funcional a los indicadores o conceptos que se manejan de forma que se garantice que se<br>hable el mismo lenguaje, abstrayéndose del mundo técnico, tal y como se explica en este<br>artículo, un diccionario de datos trata de documentar los metadatos más ligados a su<br>almacenamiento en la base de datos. Es decir, incluye aspectos técnicos como el tipo de<br>dato, formato, longitud, posibles valores que puede tomar e, incluso, transformaciones<br>sufridas, sin olvidar la definición de cada campo. La documentación de estas<br>transformaciones nos proporcionará automáticamente el linaje del dato, entendido como la<br>trazabilidad a lo largo de su ciclo de vida. Estos metadatos ayudan a los usuarios a<br>entender los datos desde el punto de vista técnico para poder explotarlos adecuadamente.<br>Por este motivo, cada base de datos debería contar con su diccionario de datos asociado.`,
                link: "https://datos.gob.es/es/blog/que-es-un-diccionario-de-datos-y-por-que-es-importante"
            }
        ];

        function renderCubes(items) {
            const grid = document.getElementById('cubeGrid');
            grid.innerHTML = '';
            if(items.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">No se encontraron resultados.</p>';
                return;
            }
            items.forEach((item, index) => {
                const cube = document.createElement('div');
                cube.className = 'cube';
                cube.style.animationDelay = `${index * 0.05}s`;
                const tagClass = item.category === 'fundamentos' ? 'tag-fundamentos' : 'tag-modelos';
                const tagText = item.category === 'fundamentos' ? 'Fundamentos' : 'Modelos de Datos';
                cube.innerHTML = `<div class="cube-tag ${tagClass}">${tagText}</div><h3>${item.title}</h3>`;
                cube.onclick = () => openDetail(item.id);
                grid.appendChild(cube);
            });
        }

        function filterCubes() {
            const searchText = document.getElementById('searchBar').value.toLowerCase();
            const category = document.getElementById('filterDropdown').value;
            const filteredData = data.filter(item => {
                const matchesSearch = item.title.toLowerCase().includes(searchText) || item.text.toLowerCase().includes(searchText);
                const matchesCategory = category === 'todos' || item.category === category;
                return matchesSearch && matchesCategory;
            });
            renderCubes(filteredData);
        }

        function showScreen(screenId) {
            document.getElementById('screen1').classList.add('hidden');
            document.getElementById('screen2').classList.add('hidden');
            document.getElementById('screen3').classList.add('hidden');
            document.getElementById(screenId).classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
            if(screenId === 'screen2') filterCubes();
        }

        function openDetail(id) {
            const item = data.find(d => d.id === id);
            if(item) {
                document.getElementById('detailTitle').innerText = item.title;
                document.getElementById('detailText').innerHTML = item.text;
                
                const linkElement = document.getElementById('detailLink');
                if(item.link !== "#") {
                    linkElement.href = item.link;
                    linkElement.style.display = "inline-block";
                } else {
                    linkElement.style.display = "none";
                }
                showScreen('screen3');
            }
        }
        renderCubes(data);
    </script>
</body>
</html>
